name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # fallow audit diffs against the merge-base with origin/main, which a
          # shallow clone does not contain.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      # The same script .husky/pre-push runs, so a green push stays green here.
      - run: bun run verify
