version: 2
updates:
  # `bun`, not `npm`: this repo's lockfile is bun.lock, which the npm ecosystem
  # does not update.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
